name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the app folder
        id: find
        run: |
          echo "Files in the repository:"
          ls -la
          CFG=$(find . -maxdepth 3 -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json was not found. Upload the files from inside the tv2u-app folder (www, native, package.json, capacitor.config.json ...)."
            exit 1
          fi
          DIR=$(dirname "$CFG")
          echo "App folder: $DIR"
          ls -la "$DIR"
          if [ ! -f "$DIR/www/index.html" ]; then
            echo "::error::www/index.html is missing. Upload the www folder too."
            exit 1
          fi
          if [ ! -f "$DIR/native/apply.mjs" ]; then
            echo "::error::native/apply.mjs is missing. Upload the native folder too (it has the video player code and icons)."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap add android

      - name: Copy the web app into it
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap sync android

      - name: Add the native video player, TV support and icons
        working-directory: ${{ steps.find.outputs.dir }}
        run: node native/apply.mjs

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tv2u-apk
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
